name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Configure git identity for real-git-repo tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Install system tools used by real end-to-end tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap tesseract-ocr poppler-utils avrdude socat
      - name: Install Chromium for browser-driven tests
        run: npx playwright-core install --with-deps chromium
      - run: npm test
