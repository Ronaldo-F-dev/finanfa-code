name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Configure git identity for real-git-repo tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Install system tools used by real end-to-end tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap tesseract-ocr poppler-utils avrdude socat tmux ffmpeg
          # Ubuntu 24.04's AppArmor policy blocks unprivileged user namespaces by
          # default, which bwrap needs; without this bash.test.ts's sandbox silently
          # fails to sandbox instead of erroring.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install Chromium for browser-driven tests
        run: npx playwright-core install --with-deps chromium
      - name: Install uv (provides uvx, used to run ruff)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm test
