# Render.com Blueprint for the web server — see
# https://render.com/docs/blueprint-spec
#
# One-time setup: in the Render dashboard, "New +" → "Blueprint", point it
# at this repo. Render reads this file and creates the service below;
# after the first deploy, set ANTHROPIC_API_KEY (or whichever provider
# you're using — see README's Setup section) as a real secret in the
# service's Environment tab, since `sync: false` here deliberately means
# "don't commit this file's own value to the repo."
#
# Also set FINANFA_WEB_USERS (a username:token pair, e.g. you:some-long-
# random-token) the same way — REQUIRED before this is reachable from
# outside localhost, since without it anyone who finds this service's URL
# can drive the agent (shell/file tools included) as a single shared,
# unauthenticated user. FINANFA_WEB_ACCOUNTS=1 or OIDC also work — see
# README's Setup section.
services:
  - type: web
    name: finanfa-code
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 4600
      - key: FINANFA_WEB_HOST
        value: 0.0.0.0
      - key: FINANFA_WEB_CWD
        value: /workspace
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FINANFA_WEB_USERS
        sync: false
    disk:
      name: finanfa-data
      mountPath: /root/.finanfa-code
      sizeGB: 1
